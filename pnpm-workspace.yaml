packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@shopify/react-native-skia': true
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.15'
  - '@expo/config-plugins@57.0.8'
  - '@expo/prebuild-config@57.0.12'
  - '@expo/router-server@57.0.6'
  - babel-preset-expo@57.0.7
  - expo-asset@57.0.11
  - expo-constants@57.0.11
  - expo-file-system@57.0.3
  - expo-modules-autolinking@57.0.10
  - expo-modules-core@57.0.11
  - expo-server@57.0.3
  - expo@57.0.13
  - '@expo/metro-runtime@57.0.10'
  - '@expo/ui@57.0.11'
  - expo-linking@57.0.6
  - expo-location@57.0.10
  - expo-media-library@57.0.4
  - expo-notifications@57.0.11
  - expo-router@57.0.13
  - expo-dev-client@57.0.12
  - expo-dev-launcher@57.0.12
  - expo-dev-menu@57.0.12

# Pin one React for the whole workspace.
#
# packages/api peers react rather than depending on it, but pnpm was still free
# to satisfy react-native's `^19.2.0` peer with a NEWER 19.2.8 than the app's
# own 19.2.3, giving the bundle two physical Reacts — and, keyed off those, two
# copies of react-query. The QueryClientProvider then set context on one copy
# while useQuery read it from the other, so every screen using a hook failed
# with "No QueryClient set" despite the provider being right there in the tree.
#
# In pnpm 11 overrides live here, not in package.json's "pnpm" field, which is
# silently ignored.
overrides:
  react: 19.2.3
  react-dom: 19.2.3
  # Pin one Metro for the whole workspace. Expo SDK 57 (@expo/metro-config)
  # wants metro ^0.84.3, but react-native 0.86's @react-native/metro-config
  # drags in metro 0.87 — so both got installed. The dev server happened to load
  # 0.84, but the production `expo export:embed` mixed a 0.87 metro-transform-
  # worker with 0.84 metro and failed with "Cannot read properties of undefined
  # (reading 'transformFile')". Force the entire suite to Expo's 0.84.4.
  metro: 0.84.4
  metro-babel-transformer: 0.84.4
  metro-cache: 0.84.4
  metro-cache-key: 0.84.4
  metro-config: 0.84.4
  metro-core: 0.84.4
  metro-file-map: 0.84.4
  metro-minify-terser: 0.84.4
  metro-resolver: 0.84.4
  metro-runtime: 0.84.4
  metro-source-map: 0.84.4
  metro-symbolicate: 0.84.4
  metro-transform-plugins: 0.84.4
  metro-transform-worker: 0.84.4
